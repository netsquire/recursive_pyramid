plugins {
    id 'java'
    id 'application'
}

repositories {
    flatDir {
        dirs "libs"
    }
}

dependencies {
    testImplementation( group:'org.junit', name:'junit', version:'4.13.1')
    testImplementation( group:'org.hamcrest', name:'hamcrest-core', version:'1.3')
}

application {
    mainClassName = 'com.ncr.test.pyramid.OurProgram'
}
